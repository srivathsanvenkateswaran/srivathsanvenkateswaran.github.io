<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uttarakhand 2026 · Itinerary</title>
<script>
  // Apply the saved theme before first paint so there is no flash.
  try { const t = localStorage.getItem('itinerary-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  /* Material 3 colour roles, generated around a green seed */
  :root {
    color-scheme: light;
    --md-primary: #1b6b50;
    --md-on-primary: #ffffff;
    --md-primary-container: #a6f2cf;
    --md-on-primary-container: #002116;
    --md-secondary: #4c6358;
    --md-secondary-container: #cfe9da;
    --md-on-secondary-container: #092017;
    --md-tertiary: #3f6374;
    --md-tertiary-container: #c3e8fc;
    --md-on-tertiary-container: #001f2a;
    --md-error: #ba1a1a;
    --md-error-container: #ffdad6;
    --md-on-error-container: #410002;
    --md-amber-container: #ffddb3;
    --md-on-amber-container: #291800;
    --md-surface: #f5fbf6;
    --md-on-surface: #171d1a;
    --md-on-surface-variant: #404944;
    --md-outline: #707974;
    --md-outline-variant: #bfc9c2;
    --md-surface-container-lowest: #ffffff;
    --md-surface-container-low: #eff5f0;
    --md-surface-container: #e9efea;
    --md-surface-container-high: #e4eae5;
    --md-surface-container-highest: #dee4df;
    --md-elev-1: 0 1px 2px rgba(0,0,0,.3), 0 1px 3px 1px rgba(0,0,0,.15);
    --md-elev-2: 0 1px 2px rgba(0,0,0,.3), 0 2px 6px 2px rgba(0,0,0,.15);
    --font: "Roboto", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --md-primary: #8bd6b4;
      --md-on-primary: #003828;
      --md-primary-container: #005139;
      --md-on-primary-container: #a6f2cf;
      --md-secondary: #b3ccbe;
      --md-secondary-container: #354b41;
      --md-on-secondary-container: #cfe9da;
      --md-tertiary: #a7cced;
      --md-tertiary-container: #264b5b;
      --md-on-tertiary-container: #c3e8fc;
      --md-error: #ffb4ab;
      --md-error-container: #93000a;
      --md-on-error-container: #ffdad6;
      --md-amber-container: #633f00;
      --md-on-amber-container: #ffddb3;
      --md-surface: #0f1512;
      --md-on-surface: #dee4df;
      --md-on-surface-variant: #bfc9c2;
      --md-outline: #89938d;
      --md-outline-variant: #404944;
      --md-surface-container-lowest: #0a0f0d;
      --md-surface-container-low: #171d1a;
      --md-surface-container: #1b211e;
      --md-surface-container-high: #252b28;
      --md-surface-container-highest: #303633;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --md-primary: #8bd6b4;
    --md-on-primary: #003828;
    --md-primary-container: #005139;
    --md-on-primary-container: #a6f2cf;
    --md-secondary: #b3ccbe;
    --md-secondary-container: #354b41;
    --md-on-secondary-container: #cfe9da;
    --md-tertiary: #a7cced;
    --md-tertiary-container: #264b5b;
    --md-on-tertiary-container: #c3e8fc;
    --md-error: #ffb4ab;
    --md-error-container: #93000a;
    --md-on-error-container: #ffdad6;
    --md-amber-container: #633f00;
    --md-on-amber-container: #ffddb3;
    --md-surface: #0f1512;
    --md-on-surface: #dee4df;
    --md-on-surface-variant: #bfc9c2;
    --md-outline: #89938d;
    --md-outline-variant: #404944;
    --md-surface-container-lowest: #0a0f0d;
    --md-surface-container-low: #171d1a;
    --md-surface-container: #1b211e;
    --md-surface-container-high: #252b28;
    --md-surface-container-highest: #303633;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--md-surface);
    color: var(--md-on-surface);
    font: 400 14px/20px var(--font);
    letter-spacing: .25px;
    -webkit-font-smoothing: antialiased;
    transition: background-color .2s, color .2s;
  }

  /* Icons: Material Symbols when the font loads, bundled SVG otherwise (offline) */
  .ic { display: inline-grid; place-items: center; width: 24px; height: 24px; flex: none; }
  .ic .ms {
    display: none; font-family: "Material Symbols Rounded"; font-size: 24px; line-height: 1;
    font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
    -webkit-font-feature-settings: "liga"; font-feature-settings: "liga";
  }
  .ic svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .ms-ready .ic .ms { display: block; }
  .ms-ready .ic svg { display: none; }
  .ic.sm { width: 18px; height: 18px; }
  .ic.sm .ms { font-size: 18px; }
  .ic.sm svg { width: 16px; height: 16px; }

  /* Top app bar */
  .app-bar {
    position: sticky; top: 0; z-index: 10;
    height: 64px; display: flex; align-items: center; gap: 8px;
    padding-inline: max(16px, calc((100% - 880px) / 2));
    background: var(--md-surface);
    transition: background-color .2s, box-shadow .2s;
  }
  .app-bar.scrolled { background: var(--md-surface-container); }
  .app-bar h1 { font: 400 22px/28px var(--font); margin: 0; flex: 1; letter-spacing: 0; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
    display: grid; place-items: center; background: transparent; color: var(--md-on-surface-variant);
    position: relative; overflow: hidden;
  }
  .icon-btn::before { content: ""; position: absolute; inset: 0; background: currentColor; opacity: 0; transition: opacity .15s; }
  .icon-btn:hover::before { opacity: .08; }
  .icon-btn:active::before { opacity: .12; }
  .icon-btn:focus-visible { outline: 2px solid var(--md-primary); outline-offset: 2px; }

  .wrap { max-width: 880px; margin: 0 auto; padding: 8px 16px 72px; }

  /* Hero */
  .hero { padding: 16px 0 24px; }
  .overline { font: 500 14px/20px var(--font); letter-spacing: .1px; color: var(--md-primary); }
  .hero h2 { font: 400 36px/44px var(--font); margin: 4px 0 8px; letter-spacing: 0; }
  .hero p { font: 400 16px/24px var(--font); letter-spacing: .5px; color: var(--md-on-surface-variant); margin: 0; }

  /* Outlined select (exposed dropdown) */
  .field-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; margin: 8px 0 20px; }
  .field { position: relative; width: 280px; max-width: 100%; }
  .field select {
    appearance: none; -webkit-appearance: none; width: 100%; height: 56px; cursor: pointer;
    font: 400 16px/24px var(--font); letter-spacing: .5px; color: var(--md-on-surface);
    background: transparent; border: 1px solid var(--md-outline); border-radius: 4px;
    padding: 0 48px 0 16px;
  }
  .field select:hover { border-color: var(--md-on-surface); }
  .field select:focus { outline: none; border: 2px solid var(--md-primary); padding-left: 15px; }
  .field select option { background: var(--md-surface-container); color: var(--md-on-surface); }
  .field label {
    position: absolute; left: 12px; top: -8px; padding: 0 4px;
    font: 400 12px/16px var(--font); letter-spacing: .4px;
    color: var(--md-on-surface-variant); background: var(--md-surface);
    transition: background-color .2s;
  }
  .field select:focus + label { color: var(--md-primary); }
  .field .trail { position: absolute; right: 12px; top: 16px; pointer-events: none; color: var(--md-on-surface-variant); }
  .supporting { font: 400 14px/20px var(--font); color: var(--md-on-surface-variant); }
  .supporting b { color: var(--md-on-surface); font-weight: 500; }

  /* Route chips */
  .route { display: flex; align-items: center; gap: 4px; overflow-x: auto; padding: 4px 0 12px; scrollbar-width: thin; }
  .chip-route {
    flex: none; height: 32px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px;
    border: 1px solid var(--md-outline-variant); border-radius: 8px;
    font: 500 14px/20px var(--font); letter-spacing: .1px; color: var(--md-on-surface-variant); white-space: nowrap;
  }
  .chip-route.home { background: var(--md-secondary-container); color: var(--md-on-secondary-container); border-color: transparent; }
  .chip-route.peak { background: var(--md-primary-container); color: var(--md-on-primary-container); border-color: transparent; }
  .hop { flex: none; color: var(--md-outline); }

  /* Stat cards (filled) */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 8px; margin: 12px 0 16px; }
  .stat { background: var(--md-surface-container-highest); border-radius: 12px; padding: 16px; }
  .stat .n { font: 400 32px/40px var(--font); color: var(--md-on-surface); }
  .stat .l { font: 500 12px/16px var(--font); letter-spacing: .5px; color: var(--md-on-surface-variant); }

  /* To-do card (outlined) with a list */
  .card-outlined { border: 1px solid var(--md-outline-variant); border-radius: 12px; background: var(--md-surface); }
  .todo { padding: 8px 0; margin-bottom: 8px; }
  .todo-head { display: flex; align-items: center; gap: 12px; padding: 8px 16px 4px; color: var(--md-error); }
  .todo-head h3 { font: 500 16px/24px var(--font); letter-spacing: .15px; margin: 0; color: var(--md-on-surface); }
  .todo ul { list-style: none; margin: 0; padding: 0; }
  .todo li { display: flex; align-items: center; gap: 16px; padding: 8px 16px; min-height: 48px; }
  .todo li .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--md-error); flex: none; margin: 0 8px; }
  .todo li .txt { flex: 1; font: 400 16px/24px var(--font); letter-spacing: .5px; }
  .todo li .when { font: 500 12px/16px var(--font); letter-spacing: .5px; color: var(--md-on-surface-variant); white-space: nowrap; }

  /* Timeline */
  .phase { margin-top: 32px; }
  .phase-head { padding: 0 4px 12px; }
  .phase-head h3 { font: 400 24px/32px var(--font); margin: 0; }
  .phase-head p { margin: 2px 0 0; color: var(--md-on-surface-variant); }

  .day {
    background: var(--md-surface-container-low); border-radius: 12px; box-shadow: var(--md-elev-1);
    margin-bottom: 12px; overflow: hidden;
  }
  .day-head { display: flex; align-items: center; gap: 16px; padding: 16px 16px 8px; }
  .date-badge {
    width: 56px; height: 56px; border-radius: 16px; flex: none;
    background: var(--md-primary-container); color: var(--md-on-primary-container);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .date-badge .mon { font: 500 11px/14px var(--font); letter-spacing: .5px; text-transform: uppercase; }
  .date-badge .dnum { font: 500 22px/26px var(--font); }
  .day-head h4 { font: 500 16px/24px var(--font); letter-spacing: .15px; margin: 0; }
  .day-head .sub { font: 400 14px/20px var(--font); color: var(--md-on-surface-variant); }

  .items { list-style: none; margin: 0; padding: 0 0 4px; }
  .item { display: flex; gap: 16px; padding: 8px 16px; align-items: flex-start; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%; flex: none; display: grid; place-items: center;
  }
  .c-transport { background: var(--md-tertiary-container); color: var(--md-on-tertiary-container); }
  .c-trek { background: var(--md-primary-container); color: var(--md-on-primary-container); }
  .c-stay { background: var(--md-secondary-container); color: var(--md-on-secondary-container); }
  .c-fun { background: var(--md-amber-container); color: var(--md-on-amber-container); }
  .c-work { background: var(--md-surface-container-highest); color: var(--md-on-surface-variant); }
  .c-meet { background: var(--md-surface-container-highest); color: var(--md-primary); }

  .what { min-width: 0; flex: 1; padding-top: 1px; }
  .what .t { font: 400 16px/24px var(--font); letter-spacing: .5px; }
  .what .t .arrow { color: var(--md-on-surface-variant); margin: 0 4px; }
  .what .m { font: 400 14px/20px var(--font); letter-spacing: .25px; color: var(--md-on-surface-variant); }
  .what .note { font: 400 12px/16px var(--font); letter-spacing: .4px; color: var(--md-on-surface-variant); margin-top: 2px; }

  .chip {
    display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: 8px;
    font: 500 12px/16px var(--font); letter-spacing: .5px; margin-left: 8px; vertical-align: 1px; white-space: nowrap;
  }
  .chip.nb { background: var(--md-error-container); color: var(--md-on-error-container); }
  .chip.chk { background: var(--md-amber-container); color: var(--md-on-amber-container); }
  .chip.pend { background: var(--md-tertiary-container); color: var(--md-on-tertiary-container); }

  .night {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px 14px; margin-top: 4px;
    border-top: 1px solid var(--md-outline-variant); color: var(--md-on-surface-variant);
  }
  .night b { color: var(--md-on-surface); font-weight: 500; }

  /* Metro line diagram: one coloured rail per line, a ring at each station */
  .pills { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: 6px 0 2px; }
  .pill {
    height: 22px; display: inline-flex; align-items: center; padding: 0 8px; border-radius: 11px;
    font: 500 12px/16px var(--font); letter-spacing: .4px; background: var(--c); color: var(--on);
  }
  .pills .sep { color: var(--md-on-surface-variant); }
  .mline { list-style: none; margin: 8px 0 2px; padding: 0; }
  .mline li { position: relative; padding: 0 0 0 28px; min-height: 22px; }
  .mline li.leg { padding-top: 4px; padding-bottom: 8px; }
  .mline li.leg::before {
    content: ""; position: absolute; left: 7px; top: 0; bottom: 0; width: 6px; border-radius: 3px; background: var(--c);
  }
  .mline li.stn::before {
    content: ""; position: absolute; left: 2px; top: 3px; width: 10px; height: 10px; border-radius: 50%;
    background: var(--md-surface-container-low); border: 3px solid var(--c);
  }
  .mline li.stn.change::before {
    width: 12px; height: 12px; left: 1px; top: 2px;
    border-color: var(--c) var(--c2) var(--c2) var(--c); transform: rotate(-45deg);
  }
  .mline .sn { font: 500 14px/20px var(--font); letter-spacing: .1px; }
  .mline .tag { font: 500 11px/16px var(--font); letter-spacing: .5px; color: var(--md-on-surface-variant); margin-left: 6px; text-transform: uppercase; }
  .mline .lg { font: 400 12px/16px var(--font); letter-spacing: .4px; color: var(--md-on-surface-variant); }
  .mline .lg b { font-weight: 500; color: var(--md-on-surface); }

  /* Things to do */
  .todo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .spot { background: var(--md-surface-container-highest); border-radius: 12px; padding: 16px; display: flex; gap: 16px; }
  .spot h5 { font: 500 16px/24px var(--font); letter-spacing: .15px; margin: 0; }
  .spot p { margin: 2px 0 0; color: var(--md-on-surface-variant); }
  .spot .chip { margin: 8px 0 0; }
  .chip.done { background: var(--md-primary-container); color: var(--md-on-primary-container); }
  .chip.info { background: var(--md-surface-container-low); color: var(--md-on-surface-variant); border: 1px solid var(--md-outline-variant); }

  footer { margin-top: 40px; text-align: center; font: 400 12px/16px var(--font); color: var(--md-on-surface-variant); }

  @media (max-width: 560px) {
    .hero h2 { font-size: 28px; line-height: 36px; }
    .field { width: 100%; }
    .item { gap: 12px; }
    .chip { margin: 4px 0 0; display: flex; width: fit-content; }
    .todo li { gap: 8px; flex-wrap: wrap; }
  }
  @media print {
    .app-bar, .field-row, .route { display: none; }
    .day { box-shadow: none; border: 1px solid #ccc; break-inside: avoid; }
  }
</style>
</head>
<body>
<header class="app-bar" id="appbar">
  <h1>Trip itinerary</h1>
  <button class="icon-btn" id="theme" type="button" aria-label="Toggle dark mode" title="Toggle dark mode"></button>
</header>

<div class="wrap">
  <section class="hero">
    <div class="overline">Sep 18 – Oct 2, 2026</div>
    <h2>Uttarakhand 2026</h2>
    <p>Kuari Pass trek, Rishikesh and Nainital</p>
  </section>

  <div class="field-row">
    <div class="field">
      <select id="traveller"></select>
      <label for="traveller">Traveller</label>
      <span class="trail" id="trail"></span>
    </div>
    <div class="supporting" id="who"></div>
  </div>

  <nav class="route" id="route" aria-label="Route"></nav>
  <section class="stats" id="stats"></section>
  <div id="notice"></div>
  <main id="timeline"></main>

  <footer>Draft itinerary · last edited Sep 15, 2026</footer>
</div>

<script>

/* ---------- Per-traveller view ---------- */
function daysFor(t) {
  return DAYS.map(d => ({
    date: d.date,
    phase: d.phase,
    title: (d.titleBy && d.titleBy[t.id]) || d.title,
    items: d.items.filter(i => !i.who || i.who.includes(t.id)),
    night: (d.nightBy && d.nightBy[t.id]) || d.night
  })).filter(d => d.items.length);
}

/* ---------- Rendering ---------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const TRIP_START = new Date('2026-09-18T00:00:00');

function parts(iso) {
  const d = new Date(iso + 'T00:00:00');
  return { mon: MONTHS[d.getMonth()], day: d.getDate(), dow: DOW[d.getDay()],
           n: Math.round((d - TRIP_START) / 864e5) + 1 };
}

const CHIP = {
  'not-booked': '<span class="chip nb">Not booked</span>',
  check: '<span class="chip chk">Check</span>',
  pending: '<span class="chip pend">Details to come</span>'
};

const lineVars = (l, l2) => `--c:${l.c};--on:${l.on}${l2 ? `;--c2:${l2.c}` : ''}`;

function metroHTML(legs) {
  const L = legs.map(g => ({ ...g, ...LINES[g.line] }));
  const pills = L.map(l => `<span class="pill" style="${lineVars(l)}">${esc(l.name)}</span>`)
    .join('<span class="sep">›</span>');
  const rows = [`<li class="stn" style="${lineVars(L[0])}"><span class="sn">${esc(L[0].from)}</span></li>`];
  L.forEach((l, i) => {
    if (i > 0) {
      rows.push(`<li class="stn change" style="${lineVars(L[i - 1], l)}"><span class="sn">${esc(l.from)}</span><span class="tag">Change</span></li>`);
    }
    rows.push(`<li class="leg" style="${lineVars(l)}"><span class="lg"><b>${esc(l.name)}</b> · towards ${esc(l.towards)}</span></li>`);
  });
  const last = L[L.length - 1];
  rows.push(`<li class="stn" style="${lineVars(last)}"><span class="sn">${esc(last.to)}</span></li>`);
  return `<div class="pills">${pills}</div><ul class="mline">${rows.join('')}</ul>`;
}

function itemHTML(it) {
  const k = KIND[it.kind];
  const title = it.from
    ? `${esc(it.from)}<span class="arrow">→</span>${esc(it.to)}`
    : esc(it.title);
  const chip = it.status ? CHIP[it.status] : '';
  return `<li class="item">
    <div class="avatar ${k.cls}">${ic(k.icon)}</div>
    <div class="what">
      <div class="t">${title}${chip}</div>
      ${it.meta ? `<div class="m">${esc(it.meta)}</div>` : ''}
      ${it.lines ? metroHTML(it.lines) : ''}
      ${it.note ? `<div class="note">${esc(it.note)}</div>` : ''}
    </div>
  </li>`;
}

const NIGHT_ICON = { train: 'train', bus: 'bus', hostel: 'bed', stay: 'bed', camp: 'tent', unknown: 'question', home: 'home' };

function dayHTML(d) {
  const p = parts(d.date);
  const n = d.night;
  const night = n
    ? `<div class="night">${ic(NIGHT_ICON[n.kind])}
         <span>${n.kind === 'home' ? 'Trip ends' : 'Night'} · <b>${esc(n.label)}</b></span></div>`
    : '';
  return `<article class="day">
    <div class="day-head">
      <div class="date-badge"><span class="mon">${p.mon}</span><span class="dnum">${p.day}</span></div>
      <div>
        <h4>${esc(d.title)}</h4>
        <div class="sub">${p.dow} · Day ${p.n}</div>
      </div>
    </div>
    <ul class="items">${d.items.map(itemHTML).join('')}</ul>
    ${night}
  </article>`;
}

function spotsHTML() {
  return `<section class="phase">
    <div class="phase-head"><h3>Things to do in Rishikesh</h3><p>Fit these around the Sep 24–27 days in town</p></div>
    <div class="todo-grid">${RISHIKESH_SPOTS.map(s => `
      <div class="spot">
        <div class="avatar ${s.chip[0] === 'done' ? 'c-fun' : 'c-trek'}">${ic(s.icon)}</div>
        <div>
          <h5>${esc(s.title)}</h5>
          ${s.text ? `<p>${esc(s.text)}</p>` : ''}
          <span class="chip ${s.chip[0]}">${esc(s.chip[1])}</span>
        </div>
      </div>`).join('')}
    </div>
  </section>`;
}

function routeHTML(t) {
  return ROUTES[t.id].map(tok => {
    if (ICONS[tok]) return `<span class="hop">${ic(tok, true)}</span>`;
    const cls = tok.endsWith('*') ? 'home' : tok.endsWith('^') ? 'peak' : '';
    const lead = cls === 'home' ? ic('home', true) : cls === 'peak' ? ic('peak', true) : '';
    return `<span class="chip-route ${cls}">${lead}${esc(tok.replace(/[*^]$/, ''))}</span>`;
  }).join('');
}

function statsHTML(days) {
  const nights = days.map(d => d.night).filter(n => n && n.kind !== 'home');
  const count = (...kinds) => nights.filter(n => kinds.includes(n.kind)).length;
  const has = (kind) => days.filter(d => d.items.some(i => i.kind === kind)).length;
  return [
    [days.length, 'Days'],
    [count('train', 'bus'), 'Nights in transit'],
    [count('hostel'), 'Hostel nights'],
    [count('camp', 'stay', 'unknown'), 'Nights up in the hills'],
    [has('trek'), 'Trek days'],
    [has('work'), 'Work days']
  ].filter(([n]) => n > 0)
   .map(([n, l]) => `<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');
}

function todoHTML(days) {
  const rows = [];
  const seen = new Set();
  const add = (key, text, when) => {
    if (seen.has(key)) return;
    seen.add(key);
    rows.push(`<li><span class="dot"></span><span class="txt">${esc(text)}</span><span class="when">${when}</span></li>`);
  };
  for (const d of days) {
    const p = parts(d.date);
    const when = `${p.mon} ${p.day}`;
    for (const it of d.items) {
      if (!it.status) continue;
      const label = it.from ? `${it.from} → ${it.to}` : it.title;
      if (it.status === 'not-booked') add('nb' + label, `Book ${label}${it.kind === 'bus' ? ' bus' : ''}`, when);
      if (it.status === 'check') add('chk' + label, `Confirm ${label}`, when);
      if (it.status === 'pending') add('pend' + label, `Add flight details, ${label}`, when);
    }
  }
  if (!rows.length) return '';
  return `<section class="card-outlined todo">
    <div class="todo-head">${ic('list')}<h3>Still to sort out</h3></div>
    <ul>${rows.join('')}</ul>
  </section>`;
}

function render(id) {
  const t = TRAVELLERS.find(x => x.id === id) || TRAVELLERS[0];
  const days = daysFor(t);
  const first = parts(days[0].date), last = parts(days[days.length - 1].date);

  $('who').innerHTML = `From <b>${esc(t.from)}</b> · ${first.mon} ${first.day} – ${last.mon} ${last.day}`;
  $('route').innerHTML = routeHTML(t);
  $('stats').innerHTML = statsHTML(days);
  $('notice').innerHTML = todoHTML(days);

  $('timeline').innerHTML = PHASES.map(ph => {
    const ds = days.filter(d => d.phase === ph.id);
    if (!ds.length) return '';
    const a = parts(ds[0].date), b = parts(ds[ds.length - 1].date);
    const range = ds.length === 1 ? `${a.mon} ${a.day}` : `${a.mon} ${a.day} – ${b.mon === a.mon ? '' : b.mon + ' '}${b.day}`;
    return `<section class="phase">
      <div class="phase-head"><h3>${ph.name}</h3><p>${range} · ${ph.blurb}</p></div>
      ${ds.map(dayHTML).join('')}
    </section>${ph.id === 'rishi' ? spotsHTML() : ''}`;
  }).join('');

  document.title = `Uttarakhand 2026 · ${t.name}`;
}

/* ---------- Traveller picker ---------- */
const sel = $('traveller');
sel.innerHTML = TRAVELLERS.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('');
$('trail').innerHTML = ic('expand');

function fromHash() {
  const id = location.hash.slice(1);
  const valid = TRAVELLERS.some(t => t.id === id) ? id : TRAVELLERS[0].id;
  sel.value = valid;
  render(valid);
}
sel.addEventListener('change', () => { history.replaceState(null, '', '#' + sel.value); render(sel.value); });
window.addEventListener('hashchange', fromHash);
fromHash();

/* ---------- Theme ---------- */
const root = document.documentElement;
const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
const effectiveTheme = () => root.dataset.theme || (darkQuery.matches ? 'dark' : 'light');
const themeBtn = $('theme');
function paintThemeButton() {
  const dark = effectiveTheme() === 'dark';
  themeBtn.innerHTML = ic(dark ? 'sun' : 'moon');
  themeBtn.title = themeBtn.ariaLabel = dark ? 'Switch to light mode' : 'Switch to dark mode';
}
themeBtn.addEventListener('click', () => {
  const next = effectiveTheme() === 'dark' ? 'light' : 'dark';
  root.dataset.theme = next;
  try { localStorage.setItem('itinerary-theme', next); } catch (e) {}
  paintThemeButton();
});
darkQuery.addEventListener('change', paintThemeButton);
paintThemeButton();

/* ---------- Chrome ---------- */
const appbar = $('appbar');
window.addEventListener('scroll', () => appbar.classList.toggle('scrolled', window.scrollY > 4), { passive: true });

if (document.fonts && document.fonts.load) {
  document.fonts.load('24px "Material Symbols Rounded"', 'home')
    .then(faces => { if (faces.length) root.classList.add('ms-ready'); })
    .catch(() => {});
}
</script>
</body>
</html>
